<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنتجات | Firo Style</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* تنسيقات خاصة بصفحة المنتجات */
        .products-page {
            padding: 40px 0;
            background-color: var(--primary-color);
            min-height: 100vh;
        }
        
        .products-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .products-header h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        
        /* شريط البحث */
        .search-bar {
            max-width: 500px;
            margin: 0 auto 30px;
            position: relative;
        }
        
        .search-bar input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border: 2px solid var(--accent-color);
            border-radius: 30px;
            font-family: 'Cairo', sans-serif;
            font-size: 1em;
            outline: none;
            transition: var(--transition);
        }
        
        .search-bar input:focus {
            border-color: #c4a882;
            box-shadow: 0 0 15px rgba(212, 197, 169, 0.3);
        }
        
        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2em;
        }
        
        /* فلاتر الفئات */
        .category-filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 40px;
        }
        
        .filter-btn {
            padding: 10px 25px;
            background-color: white;
            border: 2px solid var(--accent-color);
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            transition: var(--transition);
            color: var(--text-color);
        }
        
        .filter-btn:hover,
        .filter-btn.active {
            background-color: var(--accent-color);
            color: white;
        }
        
        /* شبكة المنتجات */
        .all-products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px;
        }
        
        /* وصف المنتج */
        .product-description {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        
        .product-category {
            display: inline-block;
            background-color: var(--primary-color);
            color: var(--text-color);
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.85em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    
    <!-- ========== الهيدر ========== -->
    <header class="header">
        <nav class="navbar">
            <div class="logo-container">
                <img src="images/logo/logo.jpg" alt="Firo Style Logo" class="logo">
            </div>
            
            <ul class="nav-menu">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="products.html" class="active">المنتجات</a></li>
                <li><a href="contact.html">تواصل معنا</a></li>
            </ul>
            
            <a href="https://wa.me/201557671143" class="whatsapp-header" target="_blank">
                <span>اطلب الآن</span>
            </a>
        </nav>
    </header>
    
    <!-- ========== صفحة المنتجات ========== -->
    <main class="products-page">
        <div class="container">
            <div class="products-header">
                <h1>منتجاتنا ✨</h1>
                <p>تشكيلة مميزة من المكرميات والهاند ميد</p>
            </div>
            
            <!-- شريط البحث -->
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="ابحث عن منتج...">
                <span class="search-icon">🔍</span>
            </div>
            
            <!-- فلاتر الفئات -->
            <div class="category-filters" id="categoryFilters">
                <button class="filter-btn active" data-category="all">الكل</button>
                <!-- الفئات هتضاف تلقائياً -->
            </div>
            
            <!-- شبكة المنتجات -->
            <div class="all-products-grid" id="allProducts">
                <!-- المنتجات هتظهر هنا -->
            </div>
        </div>
    </main>
    
    <!-- ========== الفوتر ========== -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <h3>Firo Style</h3>
                    <p>مكرميات وهاند ميد بلمسة فنية</p>
                </div>
                <div class="footer-links">
                    <h4>روابط سريعة</h4>
                    <ul>
                        <li><a href="index.html">الرئيسية</a></li>
                        <li><a href="products.html">المنتجات</a></li>
                        <li><a href="contact.html">تواصل معنا</a></li>
                    </ul>

                <div class="footer-contact">
                    <h4>تواصل معنا</h4>
                    <a href="https://wa.me/201557671143" class="whatsapp-link" target="_blank">
                        <span>📱 واتساب: 01557671143</span>
                    </a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>© 2024 Firo Style - جميع الحقوق محفوظة</p>
            </div>
        </div>
    </footer>
    
    <!-- زر واتساب عائم -->
    <a href="https://wa.me/201557671143" class="floating-whatsapp" target="_blank">
        <span>💬</span>
    </a>
    
    <!-- ربط ملفات JavaScript -->
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
